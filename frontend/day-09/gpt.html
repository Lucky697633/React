<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Sheet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            font-size: 28px;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th {
            background-color: #2f4054;
            color: white;
            padding: 15px;
            font-size: 18px;
        }

        td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
            font-size: 17px;
        }

        th {
            border: 1px solid #999;
        }
    </style>
</head>

<body>

    <h1>Student Marks Sheet</h1>

    <table>

        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Math</th>
            <th>Science</th>
            <th>English</th>
            <th>Total</th>
            <th>Grade</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Ram</td>
            <td>85</td>
            <td>90</td>
            <td>88</td>
            <td>263</td>
            <td>A</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Sita</td>
            <td>78</td>
            <td>82</td>
            <td>80</td>
            <td>240</td>
            <td>B+</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Hari</td>
            <td>92</td>
            <td>88</td>
            <td>91</td>
            <td>271</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Gita</td>
            <td>70</td>
            <td>75</td>
            <td>72</td>
            <td>217</td>
            <td>B</td>
        </tr>

    </table>

</body>
</html>
