<html>

    <head>
        <title>Input elements</title>
    </head>
    <body>
        <h1>Input element in HTML</h1>

        <label>Name : </label>
        <input type="text" placeholder="Enter Your Full Name"> <br></br>

        <label>Email :</label>
        <input type="email" placeholder="example@gmail.com" id=""> <br><br>

        <label>Password :</label>
        <input type="password" placeholder="Enter your password"> <br></br>

        <label>Contact Number :</label>
        <input type="number"> <br></br>

        <label>Gender :</label>
        <input type="radio" name="gender">
        <label>Male</label>

        <input type="radio" name="gender">
        <label>Female</label>

        <input type="radio" name="gender">
        <label>Other</label> <br></br>

        <label>Hobbies :</label>
        <input type="checkbox">
        <label>coding</label>

        <input type="checkbox">
        <label>Travelling</label>

        <input type="checkbox">
        <label>Riding</label>

        <input type="checkbox">
        <label>QA</label> <br></br>

        <input type="button" value="Send Message">

    </body>

</html>
