<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Navigation Bar */
        nav {
            background-color: #222;
            color: white;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 45px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav ul li a:hover {
            color: #ff9800;
        }

        /* Welcome Section */
        .hero {
            height: 250px;
            background-color: white;
            text-align: center;
            padding-top: 75px;
        }

        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .shop-btn {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }

        .shop-btn:hover {
            background-color: #e68900;
        }

        /* Products Section */
        .products-section {
            min-height: 437px;
            padding: 37px 20px;
            text-align: center;
        }

        .products-section h2 {
            font-size: 24px;
            margin-bottom: 27px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 18px;
        }

        /* Product Card */
        .product-card {
            background-color: white;
            width: 230px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .product-card img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .product-card h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .price {
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .cart-btn {
            background-color: #222;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cart-btn:hover {
            background-color: #444;
        }

        /* Footer */
        footer {
            height: 60px;
            background-color: #222;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">ShopEasy</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>


    <!-- Welcome Section -->
    <section class="hero">
        <h1>Welcome to ShopEasy</h1>
        <p>Best Deals on Electronics & Accessories</p>

        <button class="shop-btn">Shop Now</button>
    </section>


    <!-- Featured Products -->
    <section class="products-section">

        <h2>Featured Products</h2>

        <div class="products">

            <!-- Product 1 -->
            <div class="product-card">
                <img 
                    src="https://picsum.photos/id/96/400/250" 
                    alt="Wireless Headphone">

                <h3>Wireless Headphone</h3>

                <p class="price">$99</p>

                <button class="cart-btn">Add to Cart</button>
            </div>


            <!-- Product 2 -->
            <div class="product-card">
                <img 
                    src="https://picsum.photos/id/28/400/250" 
                    alt="Smart Watch">

                <h3>Smart Watch</h3>

                <p class="price">$120</p>

                <button class="cart-btn">Add to Cart</button>
            </div>


            <!-- Product 3 -->
            <div class="product-card">
                <img 
                    src="https://picsum.photos/id/1016/400/250" 
                    alt="Gaming Mouse">

                <h3>Gaming Mouse</h3>

                <p class="price">$45</p>

                <button class="cart-btn">Add to Cart</button>
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ShopEasy. All Rights Reserved.</p>
    </footer>

</body>
</html>
