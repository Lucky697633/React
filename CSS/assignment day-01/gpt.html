<!DOCTYPE html>
<html>
<head>
    <title>Smart Watch</title>
    <style>
        body {
            font-family: Arial;
            background: white;
        }
        .card {
            width: 300px;
            margin: 50px auto;
            padding: 25px;
            text-align: center;
            border-top: 5px solid green;
            box-shadow: 0 0 5px #ccc;
        }
        .icon {
            font-size: 45px;
            color: green;
        }
        h1 {
            font-size: 28px;
            margin: 10px;
        }
        p {
            color: gray;
            font-size: 18px;
        }
        .price {
            color: green;
            font-size: 28px;
            font-weight: bold;
        }
        button {
            background: green;
            color: white;
            border: none;
            padding: 15px 55px;
            font-size: 16px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⌚</div>
        <h1>Smart Watch</h1>
        <p>Fitness & Health Watch</p>
        <div class="price">Rs. 3500</div>
        <br>
        <button>Buy Now</button>
    </div>
</body>
</html>
